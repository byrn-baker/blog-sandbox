[defaults]
inventory = inventory/nautobot.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
gathering = smart
# yaml output via ansible-core's built-in (community.general.yaml callback was
# removed in community.general 12.x).
callback_result_format = yaml
interpreter_python = auto_silent

[inventory]
enable_plugins = networktocode.nautobot.inventory

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False
