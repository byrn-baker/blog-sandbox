---
# =============================================================================
# Lab-wide variables
# =============================================================================
# Per-device facts (management IP, DC, K3s role) come from Nautobot. This file
# holds only the settings that are uniform across the lab or that Nautobot has
# no field for.

# These VMs are plain Ubuntu, not Raspberry Pis. Skip all the Pi-only bootstrap
# and hardening branches carried over from the reference repo.
is_pi: false

timezone: "UTC"

# Lab DNS. Every node resolves against the BIND server once it is up. Until
# then, host_network lays down a resolvable path via the same address.
lab_domain: "sandbox.lab"
lab_dns_server: "10.100.0.53"
lab_dns_management_server: "192.168.3.71"

# Server data-plane gateway. This is the anycast SVI on the Arista leaves for
# the 10.100.0.0/24 subnet. The server just points its default route here;
# it has no idea it's VLAN 100 on the switch side.
bond_gateway: "10.100.0.1"
bond_gateway6: "fd10:a:100::1"

# The two NICs every server bundles into bond0. ens19 -> Leaf01, ens20 -> Leaf02.
bond_members:
  - ens19
  - ens20
# Standard server IP MTU after the router virtio migration. Deploy only after
# validating the 9500-byte virtual transport and 9214/9216 routed fabric.
# IPv4 VXLAN plus the observed two MPLS labels requires 9000 + 50 + 8 = 9058.
# Flannel IPv4 VXLAN derives a 8950-byte pod MTU from this 9000-byte bond.
bond_mtu: 9000
# Lab artifact mirror, served by lab-mirror.service on the automation host.
# Every server reaches this over eth0 on the management VLAN, which does not
# cross the emulated fabric, so it runs at bridge speed rather than the
# 11-17 KB/s the fabric gives us out to the internet. Anything large enough to
# matter gets staged here first. See demo-lab/09-lab-artifact-mirror.md.
lab_mirror_url: "http://192.168.3.21:8888"
lab_mirror_host: "192.168.3.21"

# Container registry pull-through caches on the mirror host. Same rationale as
# the file mirror: image pulls from these upstreams over the fabric are
# impractical (~15 KB/s), so each is proxied by a registry:2 cache on the mirror
# host and reached over the management VLAN. The registry_mirror role renders
# /etc/rancher/k3s/registries.yaml from this map. Ports match
# lab-mirror/registry/docker-compose.yml on the mirror host.
k3s_registry_mirrors:
  docker.io: 5000
  quay.io: 5001
  ghcr.io: 5002
  registry.k8s.io: 5003
  # Argo CD's default chart pulls redis from here, not docker.io.
  ecr-public.aws.com: 5004

# Controller-manager node-monitor-grace-period, applied to the servers by the
# k3s_config role. This is how long the control plane waits after a node's last
# kubelet heartbeat before marking it NotReady. The upstream default is 40s,
# which trips after roughly four missed heartbeats. On this emulated fabric a
# cold cross-DC path plus jitter can stall a heartbeat POST for tens of seconds
# (the same physics that forced the etcd timer relaxation and MTU clamp), so
# healthy nodes flap NotReady/Ready even while etcd and the API are fine.
# Widening to 300s tolerates those bursts; it costs nothing at steady state and
# only delays detection of a genuinely dead node, which is an easy trade in a
# lab. Longhorn in particular is sensitive to this flap, so it is set before
# Longhorn is deployed.
k3s_node_monitor_grace_period: "300s"

# Taint applied to the three DC-A control-plane nodes so the scheduler keeps
# them free for etcd/API load and does not also land Argo CD, Longhorn, or the
# observability stack there. k3s already applies the
# node-role.kubernetes.io/control-plane label to its servers, and its own
# system addons (coredns, local-path-provisioner, metrics-server) already carry
# a matching toleration, but k3s does not taint the node to match; that has to
# be requested explicitly via --node-taint (install time, in k3s_server) or
# `kubectl taint` (on an already-registered node, in k3s_config). DC-A has no
# worker nodes, so without this taint the scheduler would treat the masters as
# fair game for any pending pod.
k3s_control_plane_taint: "node-role.kubernetes.io/control-plane=true:NoSchedule"
