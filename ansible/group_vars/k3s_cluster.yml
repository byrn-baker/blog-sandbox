---
# =============================================================================
# K3s cluster settings (applied to every cluster member)
# =============================================================================
# One stretched cluster across three DCs, but the control plane is deliberately
# not stretched: all three embedded-etcd servers (DCA-k3s-m1/m2/m3) live in
# DC-A. Every node sits on the VLAN 100 stretched segment (192.168.100.0/24) and
# is mutually reachable regardless of DC, so the DC-B and DC-C nodes join as
# agents. Raft cannot tolerate the emulated cross-DC latency, so it stays local
# to the DC-A fabric.

# Pin the K3s version so a rebuild is reproducible. Blank = latest stable.
k3s_version: "v1.30.5+k3s1"

# Shared join token. Override with a vault-encrypted value in a real deployment.
k3s_token: "changeme-lab-k3s-token"

# The API server address agents and joining servers register against. This is
# the cluster-init node's VLAN 100 IP. No VIP: the gateway is an anycast SVI and
# a stretched L2 segment does not need VRRP for the control-plane endpoint.
k3s_api_host: "192.168.100.10"
k3s_api_port: 6443

# Components to disable (we manage ingress/LB separately if at all).
k3s_disable:
  - traefik

# All three etcd members are in DC-A, so raft stays inside the DC-A fabric and
# never crosses the MPLS core. These timers are still relaxed from the LAN
# defaults (100ms heartbeat, 1000ms election) because even intra-DC forwarding
# in the nested lab is jittery enough (~25ms) to risk spurious elections.
k3s_etcd_heartbeat_interval: "500"
k3s_etcd_election_timeout: "5000"

# The etcd timers above only cover raft itself. The embedded kube-controller-
# manager and kube-scheduler each run their own leader-election loop against
# etcd with Kubernetes' upstream defaults (15s lease-duration, 10s renew-
# deadline, 2s retry-period), and k3s treats a lost lease as fatal: it exits
# the whole k3s process, not just that controller. On this fabric, an
# occasional slow etcd apply (observed 5-10s under load, well past the 100ms
# etcd expects but still under the 5s etcd election-timeout above) is enough
# to blow the 10s renew-deadline and kill k3s on whichever master holds the
# lease at the time - seen hitting all three DC-A masters repeatedly, not just
# one. Widening the renew-deadline (and lease-duration, which must stay larger)
# gives the same slow applies more room before a lease loss is declared fatal.
k3s_leader_elect_lease_duration: "30s"
k3s_leader_elect_renew_deadline: "20s"

# Where to drop the fetched kubeconfig on the control machine.
kubeconfig_local_path: "./kubeconfig"
# Install payload source. The k3s binary, the install script and the airgap
# image bundle all come from the lab mirror rather than get.k3s.io / GitHub,
# because the servers' route to the internet crosses the emulated fabric and
# tops out around 15 KB/s. k3s_artifacts stages them, then k3s_server and
# k3s_agent run the installer with INSTALL_K3S_SKIP_DOWNLOAD=true.
#
# Note: with skip-download the installer never reads INSTALL_K3S_VERSION, since
# that only feeds the download URL. The version actually installed is whichever
# binary is staged under {{ k3s_mirror_url }}/{{ k3s_version }}/, so k3s_version
# above still selects it, just through the mirror path instead of a flag.
k3s_mirror_url: "{{ lab_mirror_url }}/k3s"
