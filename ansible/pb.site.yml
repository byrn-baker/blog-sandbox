---
# =============================================================================
# Part 6: provision the lab servers from Nautobot
# =============================================================================
# One stretched K3s cluster across three DCs, plus the standalone BIND DNS
# server. Inventory and every per-host variable come from Nautobot.
#
# Usage:
#   export NAUTOBOT_URL=http://localhost:8080
#   export NAUTOBOT_TOKEN=<token>
#   ansible-playbook pb.site.yml
# =============================================================================

# Plays are tagged so the data plane can be staged ahead of the cluster:
#   ansible-playbook pb.site.yml --tags network   # VLAN 100 bond only
#   (verify server-to-server VLAN 100 reachability)
#   ansible-playbook pb.site.yml                   # full run: DNS + K3s on top
# Bring up the VLAN 100 data plane first, on its own tag, so it can be run and
# verified before anything else. No apt or package work in this stage.
- name: Bring up the VLAN 100 bond
  hosts: all
  become: true
  tags: [network]
  roles:
    - host_network

# Prepare the DNS host and start BIND before the remaining servers perform
# package installation or K3s setup. Stop the run if this prerequisite fails.
- name: Base prep for the DNS server
  hosts: dns_servers
  become: true
  any_errors_fatal: true
  tags: [dns]
  roles:
    - common

- name: Stand up the lab DNS server
  hosts: dns_servers
  become: true
  any_errors_fatal: true
  tags: [dns]
  roles:
    - bind_dns

- name: Base prep for the remaining managed servers
  hosts: "all:!dns_servers"
  become: true
  roles:
    - common

# Format and mount the secondary disk for Longhorn on nodes whose config context
# sets storage.enabled. Tagged so it can be staged and verified on its own:
#   ansible-playbook pb.site.yml --tags storage
# The DC-A control-plane nodes are not in storage_nodes, so they are skipped
# even if they carry a spare disk. Longhorn itself is deployed later via Argo;
# this only prepares the mount it will use.
- name: Prepare Longhorn storage disks
  hosts: storage_nodes
  become: true
  tags: [storage]
  roles:
    - longhorn_disk

# k3s_artifacts stages the install payload (binary, install script, airgap image
# bundle) from the lab mirror on the automation host. It runs alongside the
# install roles rather than as its own play so that its defaults (binary path,
# script path, image dir) stay in scope for k3s_server and k3s_agent. Role
# defaults only apply to the play the role runs in, so splitting them out would
# leave those paths undefined.
- name: Install K3s control plane (servers, all in DC-A)
  hosts: k3s_servers
  become: true
  serial: 1
  tags: [k3s]
  roles:
    - k3s_artifacts
    - k3s_server

- name: Install K3s workers
  hosts: k3s_agents
  become: true
  tags: [k3s]
  roles:
    - k3s_artifacts
    - k3s_agent

# Point every node's containerd at the lab registry pull-through caches so
# workload image pulls (Longhorn, VictoriaMetrics, Argo, etc.) go over the
# management VLAN instead of the fabric. serial:1 rolls the k3s restarts one
# node at a time, keeping the three-member etcd quorum intact.
- name: Point k3s at the lab registry caches
  hosts: k3s_cluster
  become: true
  serial: 1
  tags: [k3s, registry]
  roles:
    - registry_mirror

- name: Fetch kubeconfig to the control machine
  hosts: k3s_init
  become: true
  tags: [k3s]
  tasks:
    - name: Read kubeconfig from the init server
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig

    - name: Save kubeconfig locally with the reachable API address
      ansible.builtin.copy:
        content: "{{ k3s_kubeconfig.content | b64decode | replace('127.0.0.1', k3s_api_host) }}"
        dest: "{{ kubeconfig_local_path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
