---
# =============================================================================
# Nautobot GraphQL dynamic inventory: the single source of truth for Ansible
# =============================================================================
# Uses the GraphQL inventory plugin so we control the exact fields returned and
# group/compose on predictable names. Every host, group, and variable comes
# from Nautobot; there is no static hosts file.
#
# ansible_host is set automatically from primary_ip4.host (the eth0 management
# address, 192.168.3.0/24). K3s membership/role comes from each device's local
# config context. The VLAN 100 bond addresses come from the bond0 interface.
#
# Requires env vars:
#   NAUTOBOT_URL    e.g. http://localhost:8080
#   NAUTOBOT_TOKEN  an API token with read access
#
# Usage:
#   ansible-inventory -i inventory/nautobot.yml --graph
# =============================================================================
plugin: networktocode.nautobot.gql_inventory
# api_endpoint and token are read from NAUTOBOT_URL / NAUTOBOT_TOKEN.
validate_certs: false

query:
  # Only manage the Ubuntu servers. The network devices are Golden Config's.
  virtual_machines:
    filters:
      name: EXCLUDE ALL
  devices:
    filters:
      role: Server
    name:
    local_config_context_data:
    location:
      name:
    primary_ip4:
      host:
    platform:
      napalm_driver:
    interfaces:
      name:
      mac_address:
      ip_addresses:
        address:

# No group_by: the roles group on the k3s_* groups below, not on location.
# (group_by location.name produced hyphenated group names Ansible warns about.)

# Membership and role come straight from the local config context.
groups:
  k3s_cluster: "local_config_context_data.k3s.member | default(false)"
  k3s_servers: "local_config_context_data.k3s.member | default(false) and local_config_context_data.k3s.role | default('') == 'server'"
  k3s_agents: "local_config_context_data.k3s.member | default(false) and local_config_context_data.k3s.role | default('') == 'agent'"
  k3s_init: "local_config_context_data.k3s.cluster_init | default(false)"
  dns_servers: "not (local_config_context_data.k3s.member | default(false))"
  # Nodes that contribute a Longhorn disk. Read from the same Git-synced config
  # context as k3s role, so adding storage to a node is a context change, not an
  # inventory edit.
  storage_nodes: "local_config_context_data.storage.enabled | default(false)"

compose:
  ansible_user: "'ubuntu'"
  # K3s node labels and cluster-init flag, surfaced as plain host vars for the
  # roles to consume.
  k3s_role: "local_config_context_data.k3s.role | default('')"
  k3s_node_labels: "local_config_context_data.k3s.node_labels | default('')"
  k3s_cluster_init: "local_config_context_data.k3s.cluster_init | default(false)"
  # host_network still derives the CIDR addresses used by netplan. K3s needs a
  # mask-free node IP even when pb.site.yml is run with --tags k3s, so derive it
  # directly from the queried bond0 interface instead of relying on role facts.
  vlan100_ipv4: "interfaces | selectattr('name', 'equalto', 'bond0') | map(attribute='ip_addresses') | first | map(attribute='address') | reject('search', ':') | first | regex_replace('/.*$', '')"
  # Longhorn disk properties, surfaced as plain host vars for the longhorn_disk
  # role. Defaults match the role defaults so a node with storage.enabled but no
  # explicit device/path still works.
  storage_disk: "local_config_context_data.storage.disk_device | default('/dev/sdb')"
  storage_mount: "local_config_context_data.storage.mount_path | default('/var/lib/longhorn')"
