---
# =============================================================================
# k3s_agent: worker nodes
# =============================================================================
# Agents register against the cluster API on the VLAN 100 stretched segment and
# run workloads. Node role/labels come from the Nautobot config context.

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Set K3s version flag
  ansible.builtin.set_fact:
    k3s_version_flag: "{{ ('INSTALL_K3S_VERSION=' + k3s_version) if k3s_version else '' }}"

- name: Install K3s agent and join the cluster
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | {{ k3s_version_flag }} K3S_URL="https://{{ k3s_api_host }}:{{ k3s_api_port }}" \
      K3S_TOKEN="{{ k3s_token }}" sh -s - agent \
      --node-ip {{ vlan100_ipv4 }} \
      --node-label {{ k3s_node_labels | default('') }}
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Ensure K3s agent is running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
