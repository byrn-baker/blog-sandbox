---
# =============================================================================
# host_network: bring up the server data-plane bond
# =============================================================================
# The server sees a plain bond of two NICs (ens19 + ens20) with an address on
# the 10.100.0.0/24 subnet. It is not VLAN-aware: the VLAN 100 tagging and
# the EVPN Ethernet Segment live on the Arista leaf switch ports, not here. The
# bond is a static LAG (balance-xor) because the nested-lab bridges do not
# forward LACP. Addresses come from the device's bond0 interface in Nautobot.

- name: Derive the bond address from the device's bond0 interface
  ansible.builtin.set_fact:
    _bond0_addrs: >-
      {{ interfaces | selectattr('name', 'equalto', 'bond0')
         | map(attribute='ip_addresses') | sum(start=[])
         | map(attribute='address') | list }}

- name: Split the bond address into IPv4 and IPv6
  ansible.builtin.set_fact:
    bond_ipv4: "{{ (_bond0_addrs | reject('search', ':') | first) | default('') }}"
    bond_ipv6: "{{ (_bond0_addrs | select('search', ':') | first) | default('') }}"

- name: Read the bond0 MAC from Nautobot
  ansible.builtin.set_fact:
    bond_mac: >-
      {{ (interfaces | selectattr('name', 'equalto', 'bond0')
         | map(attribute='mac_address') | select | first) | default('') }}

- name: Assert the bond has a unique MAC in Nautobot
  ansible.builtin.assert:
    that:
      - bond_mac | length > 0
    fail_msg: >-
      No bond0 MAC for {{ inventory_hostname }} in Nautobot. These VMs are
      template clones with a shared machine-id, so an explicit unique MAC is
      required or systemd-networkd derives the same one on every server.

- name: Assert the bond has an IPv4 address in Nautobot
  ansible.builtin.assert:
    that:
      - bond_ipv4 | length > 0
    fail_msg: >-
      No bond0 IPv4 address found for {{ inventory_hostname }} in Nautobot.
      The device's bond0 interface must carry a 10.100.0.0/24 address.

- name: Inspect the obsolete bond Netplan file
  ansible.builtin.stat:
    path: /etc/netplan/60-vlan100-bond.yaml
  register: legacy_bond_netplan

- name: Retire the previous bond definition before Netplan merges it
  when: legacy_bond_netplan.stat.exists
  block:
    - name: Preserve the obsolete definition outside Netplan input files
      ansible.builtin.copy:
        remote_src: true
        src: /etc/netplan/60-vlan100-bond.yaml
        dest: /etc/netplan/60-vlan100-bond.yaml.retired
        mode: "0600"
    - name: Remove the superseded definition
      ansible.builtin.file:
        path: /etc/netplan/60-vlan100-bond.yaml
        state: absent
      notify: Apply netplan

- name: Replace the overlapping resolver inherited from the VM template
  ansible.builtin.replace:
    path: /etc/netplan/50-cloud-init.yaml
    regexp: '^(\s*-\s*)192\.168\.100\.1(\s*)$'
    replace: '\g<1>{{ lab_dns_management_server }}\g<2>'
  notify: Apply netplan

- name: Render netplan for the data-plane bond
  ansible.builtin.template:
    src: bond0.yaml.j2
    dest: /etc/netplan/60-bond0.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan

- name: Ensure netplan is applied before continuing
  ansible.builtin.meta: flush_handlers
