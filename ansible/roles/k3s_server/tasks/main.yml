---
# =============================================================================
# k3s_server: control-plane nodes (embedded etcd, one per DC)
# =============================================================================
# Three server nodes, one in each DC, form a stretched HA control plane. The
# init node runs --cluster-init; the other two join it. etcd timers are relaxed
# because the peer traffic crosses the MPLS core between datacenters.
#
# The installer runs offline. k3s_artifacts has already put the binary at
# {{ k3s_bin_dir }}/k3s and the script at {{ k3s_install_script_path }}, both
# pulled from the lab mirror, so INSTALL_K3S_SKIP_DOWNLOAD=true makes this a
# purely local operation. Pulling from get.k3s.io instead means a 63 MB download
# over the emulated fabric at ~15 KB/s, which the script gives up on.
#
# Note the guard below keys on the systemd unit, not on the binary. The binary
# is present before the installer ever runs now, so `creates: /usr/local/bin/k3s`
# would skip the install on a fresh node.

- name: Check whether the k3s server is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_service_unit

- name: Build common server install args
  ansible.builtin.set_fact:
    k3s_common_args: >-
      {% for c in k3s_disable %}--disable {{ c }} {% endfor %}
      --tls-san {{ k3s_api_host }}
      --node-ip {{ vlan100_ipv4 }}
      --node-label {{ k3s_node_labels | default('') }}
      --node-taint {{ k3s_control_plane_taint }}
      --etcd-arg heartbeat-interval={{ k3s_etcd_heartbeat_interval }}
      --etcd-arg election-timeout={{ k3s_etcd_election_timeout }}
      --write-kubeconfig-mode 644

# --- Cluster-init node bootstraps embedded etcd ---
- name: Initialize the cluster (cluster-init node only)
  when:
    - k3s_cluster_init | default(false)
    - not k3s_service_unit.stat.exists
  block:
    - name: Install K3s as the initializing server
      ansible.builtin.shell: |
        {{ k3s_install_script_path }} server \
          --cluster-init \
          --token "{{ k3s_token }}" \
          {{ k3s_common_args }}
      args:
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"

    - name: Wait for the API server to be ready
      ansible.builtin.command: k3s kubectl get --raw='/readyz'
      register: k3s_ready
      retries: 30
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

# --- Remaining servers join the etcd cluster ---
- name: Join the cluster (additional servers)
  when:
    - not (k3s_cluster_init | default(false))
    - not k3s_service_unit.stat.exists
  block:
    - name: Install K3s and join the existing cluster
      ansible.builtin.shell: |
        {{ k3s_install_script_path }} server \
          --server "https://{{ k3s_api_host }}:{{ k3s_api_port }}" \
          --token "{{ k3s_token }}" \
          {{ k3s_common_args }}
      args:
        creates: /etc/systemd/system/k3s.service
      environment:
        INSTALL_K3S_SKIP_DOWNLOAD: "true"

    - name: Wait for this node to register
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_join
      retries: 30
      delay: 5
      until: k3s_join.rc == 0
      changed_when: false

- name: Ensure K3s server is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
