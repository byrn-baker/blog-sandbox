---
# =============================================================================
# k3s_server: control-plane nodes (embedded etcd, one per DC)
# =============================================================================
# Three server nodes, one in each DC, form a stretched HA control plane. The
# init node runs --cluster-init; the other two join it. etcd timers are relaxed
# because the peer traffic crosses the MPLS core between datacenters.

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Build common server install args
  ansible.builtin.set_fact:
    k3s_common_args: >-
      {% for c in k3s_disable %}--disable {{ c }} {% endfor %}
      --tls-san {{ k3s_api_host }}
      --node-ip {{ vlan100_ipv4 }}
      --node-label {{ config_context.k3s.node_labels | default('') }}
      --etcd-arg heartbeat-interval={{ k3s_etcd_heartbeat_interval }}
      --etcd-arg election-timeout={{ k3s_etcd_election_timeout }}
      --write-kubeconfig-mode 644

- name: Set K3s version flag
  ansible.builtin.set_fact:
    k3s_version_flag: "{{ ('INSTALL_K3S_VERSION=' + k3s_version) if k3s_version else '' }}"

# --- Cluster-init node bootstraps embedded etcd ---
- name: Initialize the cluster (cluster-init node only)
  when:
    - config_context.k3s.cluster_init | default(false)
    - not k3s_binary.stat.exists
  block:
    - name: Install K3s as the initializing server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | {{ k3s_version_flag }} sh -s - server \
          --cluster-init \
          --token "{{ k3s_token }}" \
          {{ k3s_common_args }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for the API server to be ready
      ansible.builtin.command: k3s kubectl get --raw='/readyz'
      register: k3s_ready
      retries: 30
      delay: 5
      until: k3s_ready.rc == 0
      changed_when: false

# --- Remaining servers join the etcd cluster ---
- name: Join the cluster (additional servers)
  when:
    - not (config_context.k3s.cluster_init | default(false))
    - not k3s_binary.stat.exists
  block:
    - name: Install K3s and join the existing cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | {{ k3s_version_flag }} sh -s - server \
          --server "https://{{ k3s_api_host }}:{{ k3s_api_port }}" \
          --token "{{ k3s_token }}" \
          {{ k3s_common_args }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for this node to register
      ansible.builtin.command: k3s kubectl get nodes
      register: k3s_join
      retries: 30
      delay: 5
      until: k3s_join.rc == 0
      changed_when: false

- name: Ensure K3s server is running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
