---
# Local config context for DCC-k3s-w4 (K3s agent + Longhorn storage node, DC-C).
k3s:
  member: true
  role: "agent"
  node_labels: "topology.kubernetes.io/zone=dc-c"
storage:
  enabled: true
  disk_device: "/dev/sdb"
  mount_path: "/var/lib/longhorn"
monitor:
  enabled: true
  target: "192.168.100.53"
