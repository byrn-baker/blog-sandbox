---
_metadata:
  name: "Border-Router Routing Properties"
  weight: 100
  description: "ISIS + MPLS + BFD for border router"
  roles:
    - name: "Border-Router"
  config_context_schema: "Routing Properties"
isis:
  process_name: "SP-ISIS"
  metric_style: "wide"
  is_type: "level-2-only"
  log_adjacency_changes: true
mpls:
  ldp_router_id: "Loopback0"
  ldp_sync: true
  explicit_null: true
bfd:
  interval: 500
  min_rx: 500
  multiplier: 5
  echo: false
# BGP settings (timers, log-neighbor-changes, default-ipv4-unicast) are
# modeled as Extra Attributes on the BGP routing instance, not config context.
# internet_edge (NAT + default route) stays here: IOS NAT has no native model.
internet_edge:
  default_route:
    mask: "0.0.0.0"
    next_hop: "192.168.255.1"
    global: true
  nat:
    access_list: "NAT-INET"
    overload: true
    source_prefixes:
      - "192.168.100.0/24"
      - "192.168.101.0/24"
      - "192.168.201.0/24"
      - "192.168.31.0/24"
