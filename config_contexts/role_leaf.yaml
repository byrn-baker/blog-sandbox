---
_metadata:
  name: "Leaf DC Fabric Properties"
  weight: 100
  description: "AVD-aligned eBGP underlay + EVPN overlay + VXLAN for DC leaves"
  roles:
    - name: "Leaf"
  config_context_schema: "DC Fabric Properties"
platform:
  service_routing_protocols_model: "multi-agent"
  vlan_internal_order:
    range_start: 1006
    range_end: 1199
  spanning_tree_mode: "mstp"
  spanning_tree_priority: 4096
# BGP settings (peer-group tuning, timers, redistribute) are modeled as
# Extra Attributes on the BGP routing instance and peer groups, not here.
# Config context keeps only the prefix-list and route-map bodies below, which
# have no native Nautobot object.
evpn:
  multihop: 3
  update_source: "Loopback0"
bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
vxlan:
  source_interface: "Loopback1"
  virtual_router_mac: "00:1c:73:00:00:99"
prefix_lists:
  - name: "PL-LOOPBACKS-EVPN-OVERLAY"
    entries:
      - sequence: 10
        action: "permit"
        prefix: "10.2.0.0/16"
        comparison: "eq 32"
      - sequence: 20
        action: "permit"
        prefix: "10.3.0.0/16"
        comparison: "eq 32"
route_maps:
  - name: "RM-CONN-2-BGP"
    entries:
      - sequence: 10
        action: "permit"
        match: "ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY"
