---
_metadata:
  name: "P-Router Routing Properties"
  weight: 100
  description: "ISIS + MPLS + BFD for SP core P routers"
  roles:
    - name: "P-Router"
  config_context_schema: "Routing Properties"
isis:
  process_name: "SP-ISIS"
  metric_style: "wide"
  is_type: "level-2-only"
  log_adjacency_changes: true
mpls:
  ldp_router_id: "Loopback0"
  ldp_sync: true
  explicit_null: true
bfd:
  interval: 500
  min_rx: 500
  multiplier: 5
  echo: false
# P routers run no BGP instance. Any BGP settings for BGP-speaking roles are
# modeled as Extra Attributes on the BGP routing instance, not config context.
