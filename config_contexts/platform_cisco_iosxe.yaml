---
# Per-push Netmiko arguments for Golden Config deployment.
#
# These are send_config_set() arguments, not Netmiko constructor arguments, so
# they cannot live in PLUGINS_CONFIG connection_options. nornir-nautobot reads
# netmiko_kwargs only from a device custom field or from config context.
#
# Scope warning: despite the name, these do NOT reach save_config(). The
# dispatcher runs the save as `netmiko_save_config(confirm=True)` with no kwargs
# (nornir_nautobot/plugins/tasks/dispatcher/default.py), and that path uses
# send_command_timing with a hardcoded read_timeout, which only the
# connection-level settings in nautobot_config.py PLUGINS_CONFIG can influence.
#
# error_pattern: makes Netmiko raise on the exact rejected CLI line instead of
# returning a generic E1030 that lists every pattern it searched for. The pattern
# requires "% " with a trailing space so IOS syslog lines such as
# %LINK-3-UPDOWN and %SYS-5-CONFIG_I do not trigger a false failure.
#
# read_timeout: seconds Netmiko waits for command echo (cmd_verify) and prompt
# return after each config line. Default is 30s, which is too short when IOS-XE
# processes commands that trigger syslog output (ISIS adjacency, IPv6 DAD, MPLS
# LDP). Raised to 300 to match the EOS context and the connection-level
# read_timeout_override in nautobot_config.py.
#
# cmd_verify: disabled because IOS-XE syslog messages (%BGP-5-ADJCHANGE,
# %ISIS-5-ADJCHANGE, %LDP-5-NBRCHG) interleave with command echoes during
# config pushes on BORDER1/PE devices, causing "Pattern not detected" failures.
# error_pattern still catches actual rejected commands.
_metadata:
  name: "Cisco IOS-XE Netmiko Properties"
  weight: 1000
  description: "Netmiko send_config_set arguments for IOS-XE deployment"
  platforms:
    - name: "cisco_iosxe"
netmiko_kwargs:
  error_pattern: "^% (Invalid input|Incomplete command|Ambiguous command|Unrecognized command|Too many parameters|Wrong parameter|Cannot execute)"
  read_timeout: 300
  cmd_verify: false
