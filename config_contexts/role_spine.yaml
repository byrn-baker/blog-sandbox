---
_metadata:
  name: "Spine DC Fabric Properties"
  weight: 100
  description: "AVD-aligned eBGP underlay + EVPN overlay for DC spines"
  roles:
    - name: "Spine"
  config_context_schema: "DC Fabric Properties"
platform:
  service_routing_protocols_model: "multi-agent"
  vlan_internal_order:
    range_start: 1006
    range_end: 1199
  spanning_tree_mode: "none"
bgp:
  timers:
    keepalive: 3
    hold: 9
  maximum_paths: 4
  ecmp: 4
  log_neighbor_changes: true
  default_ipv4_unicast: false
  peer_groups:
    ipv4_underlay:
      name: "IPv4-UNDERLAY-PEERS"
      send_community: true
      maximum_routes: 256000
    evpn_overlay:
      name: "EVPN-OVERLAY-PEERS"
      next_hop_unchanged: true
      update_source: "Loopback0"
      ebgp_multihop: 3
      bfd: true
      send_community: true
      maximum_routes: 0
  redistribute:
    connected:
      route_map: "RM-CONN-2-BGP"
evpn:
  multihop: 3
  update_source: "Loopback0"
bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
prefix_lists:
  - name: "PL-LOOPBACKS-EVPN-OVERLAY"
    entries:
      - sequence: 10
        action: "permit"
        prefix: "10.2.0.0/16"
        comparison: "eq 32"
route_maps:
  - name: "RM-CONN-2-BGP"
    entries:
      - sequence: 10
        action: "permit"
        match: "ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY"
