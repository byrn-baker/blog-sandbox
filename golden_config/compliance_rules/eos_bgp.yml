---
- feature_slug: "130-bgp"
  platform_network_driver: "arista_eos"
  # Unordered: the device returns BGP lines in its own canonical order
  # (numeric neighbor sort, maximum-paths before timers, vlan blocks after
  # address-families). Content matches intended; only line order differs.
  config_ordered: false
  match_config: "router bgp"
  config_remediation: true