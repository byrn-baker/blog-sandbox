# Mock SoT context for a Leaf switch on arista_eos platform.
# Exercises EVPN/VXLAN, VRFs, VLANs, prefix lists, route maps, BFD.
---
hostname: DCA-Leaf03

tags: []

config_context:
  bfd:
    multihop:
      interval: 300
      min_rx: 300
      multiplier: 3
  evpn:
    multihop: 3
    update_source: Loopback0
  vxlan:
    source_interface: Loopback1
    virtual_router_mac: "00:1c:73:00:00:99"
  server_esi_vlan: 100
  server_esi_octets:
    DCA-k3s-m1: 10
    DCA-k3s-w1: 11
    DCA-k3s-w2: 12
    DCA-DNS: 53
    DCB-k3s-m2: 20
    DCB-k3s-w3: 21
    DCB-k3s-w4: 22
    DCC-k3s-m3: 30
    DCC-k3s-w5: 31
  platform:
    spanning_tree_mode: mstp
    spanning_tree_priority: 4096
    vlan_internal_order:
      range_start: 1006
      range_end: 1199
    service_routing_protocols_model: multi-agent
  prefix_lists:
    - name: PL-LOOPBACKS-EVPN-OVERLAY
      entries:
        - sequence: 10
          action: permit
          prefix: "10.2.0.0/16"
          comparison: "eq 32"
        - sequence: 20
          action: permit
          prefix: "10.3.0.0/16"
          comparison: "eq 32"
  route_maps:
    - name: RM-CONN-2-BGP
      entries:
        - sequence: 10
          action: permit
          match: "ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY"

role:
  name: Leaf

platform:
  name: arista_eos
  network_driver: arista_eos

location:
  name: DC-A
  vlans:
    - vid: 100
      name: SERVER_K3S
      description: "Stretched EVPN segment"
      _custom_field_data:
        vni: 10100
    - vid: 101
      name: STORAGE
      description: "Site-local storage segment"
      _custom_field_data:
        vni: 10101

interfaces:
  - name: Ethernet1
    description: "to DCA-Spine01 Ethernet1"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.1.1.5/31"
        ip_version: 4
      - address: "fd10:1:1::5/127"
        ip_version: 6
    tags: []
  - name: Ethernet2
    description: "to DCA-Spine02 Ethernet1"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.1.1.11/31"
        ip_version: 4
      - address: "fd10:1:1::11/127"
        ip_version: 6
    tags: []
  - name: Loopback0
    description: "Router-ID"
    enabled: true
    type: VIRTUAL
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.2.1.4/32"
        ip_version: 4
      - address: "fd10:2:1::4/128"
        ip_version: 6
    tags: []
  - name: Loopback1
    description: "VTEP_VXLAN_Tunnel_Source"
    enabled: true
    type: VIRTUAL
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.3.1.4/32"
        ip_version: 4
    tags: []
  - name: Management1
    description: "Management - MGMT-VRF"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf:
      name: MGMT-VRF
      rd: "65000:999"
      _custom_field_data:
        vni: null
    ip_addresses:
      - address: "192.168.3.32/24"
        ip_version: 4
    tags: []
  - name: Vlan100
    description: SERVER_K3S
    enabled: true
    type: VIRTUAL
    mgmt_only: false
    vrf:
      name: SERVERS
      rd: "65000:10000"
      _custom_field_data:
        vni: 10000
    ip_addresses:
      - address: "192.168.100.1/24"
        ip_version: 4
        parent:
          prefix: "192.168.100.0/24"
      - address: "fd10:a:100::1/64"
        ip_version: 6
    tags: []
  - name: Vlan101
    description: STORAGE
    enabled: true
    type: VIRTUAL
    mgmt_only: false
    vrf:
      name: SERVERS
      rd: "65000:10000"
      _custom_field_data:
        vni: 10000
    ip_addresses:
      - address: "192.168.101.1/24"
        ip_version: 4
        parent:
          prefix: "192.168.101.0/24"
      - address: "fd10:a:101::1/64"
        ip_version: 6
    tags: []
  - name: Ethernet10
    description: "Border handoff to CE1 (SERVERS)"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf:
      name: SERVERS
      rd: "65000:10000"
      _custom_field_data:
        vni: 10000
    ip_addresses:
      - address: "10.1.1.16/31"
        ip_version: 4
        parent:
          prefix: "10.1.1.16/31"
    tags: []
  - name: Ethernet3
    description: ""
    enabled: false
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses: []
    connected_interface: null
    tags: []
  - name: Ethernet7
    description: "DCA-DNS bond member (ESI multihome)"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses: []
    connected_interface:
      name: ens19
      device:
        name: DCA-DNS
    tags: []

vrfs:
  - name: MGMT-VRF
    rd: "65000:999"
    _custom_field_data:
      vni: null
  - name: SERVERS
    rd: "65000:10000"
    _custom_field_data:
      vni: 10000

bgp_routing_instances:
  - autonomous_system:
      asn: 65111
    router_id:
      address: "10.2.1.4/32"
    extra_attributes:
      timers:
        keepalive: 3
        hold: 9
      maximum_paths: 4
      ecmp: 4
      log_neighbor_changes: true
      default_ipv4_unicast: false
      redistribute:
        connected:
          route_map: "RM-CONN-2-BGP"
    peer_groups:
      - name: EVPN-OVERLAY-PEERS
        autonomous_system: null
        extra_attributes:
          update_source: "Loopback0"
          ebgp_multihop: 3
          bfd: true
          send_community_extended: true
          maximum_routes: 0
        address_families:
          - afi_safi: L2_EVPN
      - name: IPV4-UNDERLAY-PEERS
        autonomous_system: null
        extra_attributes:
          send_community: true
          maximum_routes: 12000
        address_families:
          - afi_safi: IPV4_UNICAST
    address_families:
      - afi_safi: IPV4_UNICAST
        vrf: null
        extra_attributes:
          redistribute:
            - "connected"
      - afi_safi: IPV4_UNICAST
        vrf:
          name: SERVERS
        extra_attributes:
          redistribute:
            - "connected"
    endpoints:
      - enabled: true
        peer_group:
          name: EVPN-OVERLAY-PEERS
        source_ip:
          address: "10.2.1.4/32"
        peering:
          endpoints:
            - enabled: true
              source_ip:
                address: "10.2.1.2/32"
              routing_instance:
                device:
                  name: DCA-Spine01
                autonomous_system:
                  asn: 65101
            - enabled: true
              source_ip:
                address: "10.2.1.4/32"
              routing_instance:
                device:
                  name: DCA-Leaf01
                autonomous_system:
                  asn: 65111
      - enabled: true
        peer_group:
          name: IPV4-UNDERLAY-PEERS
        source_ip:
          address: "10.1.1.5/31"
        peering:
          endpoints:
            - enabled: true
              source_ip:
                address: "10.1.1.4/31"
              routing_instance:
                device:
                  name: DCA-Spine01
                autonomous_system:
                  asn: 65101
            - enabled: true
              source_ip:
                address: "10.1.1.5/31"
              routing_instance:
                device:
                  name: DCA-Leaf01
                autonomous_system:
                  asn: 65111
      - enabled: true
        peer_group:
          name: IPV4-UNDERLAY-PEERS
        source_ip:
          address: "10.1.1.11/31"
        peering:
          endpoints:
            - enabled: true
              source_ip:
                address: "10.1.1.10/31"
              routing_instance:
                device:
                  name: DCA-Spine02
                autonomous_system:
                  asn: 65102
            - enabled: true
              source_ip:
                address: "10.1.1.11/31"
              routing_instance:
                device:
                  name: DCA-Leaf01
                autonomous_system:
                  asn: 65111
      - enabled: true
        peer_group: null
        source_ip:
          address: "10.1.1.16/31"
        extra_attributes:
          maximum_routes: 12000
        peering:
          endpoints:
            - enabled: true
              source_ip:
                address: "10.1.1.17/31"
              autonomous_system:
                asn: 65001
              routing_instance:
                device:
                  name: CE1
                autonomous_system:
                  asn: 65001
            - enabled: true
              source_ip:
                address: "10.1.1.16/31"
              routing_instance:
                device:
                  name: DCA-Leaf03
                autonomous_system:
                  asn: 65113

# No IGP for EOS DC fabric
igp_routing_instances: []
