# Mock SoT context for a CE-Router on cisco_ios platform.
# CE routers have no peer-groups and no VRFs (except MGMT).
# All BGP neighbors are non-peer-group, non-VRF, global IPv4.
# This exercises the code path that generates the consolidated
# address-family ipv4 block.
---
hostname: CE1

config_context: {}

role:
  name: CE-Router

platform:
  name: cisco_iosxe
  network_driver: cisco_ios

location:
  name: DC-A
  vlans: []

interfaces:
  - name: GigabitEthernet1
    description: "Management - MGMT-VRF"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf:
      name: MGMT-VRF
      rd: "65000:999"
    ip_addresses:
      - address: "192.168.3.60/24"
        ip_version: 4
    tags: []
  - name: GigabitEthernet2
    description: "PE-CE to SPE1 GigabitEthernet5"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "172.16.1.1/31"
        ip_version: 4
      - address: "fd10:c:1::1/127"
        ip_version: 6
    tags: []
  - name: GigabitEthernet3
    description: "to DCA-Spine01 Ethernet10"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.1.1.0/31"
        ip_version: 4
      - address: "fd10:1:1::/127"
        ip_version: 6
    tags: []
  - name: GigabitEthernet4
    description: "to DCA-Spine02 Ethernet10"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.1.1.2/31"
        ip_version: 4
      - address: "fd10:1:1::2/127"
        ip_version: 6
    tags: []
  - name: GigabitEthernet5
    description: "Border handoff to DCA-Leaf03"
    enabled: true
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.1.1.17/31"
        ip_version: 4
    tags: []
  - name: Loopback0
    description: "Router-ID"
    enabled: true
    type: VIRTUAL
    mgmt_only: false
    vrf: null
    ip_addresses:
      - address: "10.2.1.1/32"
        ip_version: 4
      - address: "fd10:2:1::1/128"
        ip_version: 6
    tags: []
  - name: GigabitEthernet6
    description: ""
    enabled: false
    type: A_1000BASE_T
    mgmt_only: false
    vrf: null
    ip_addresses: []
    tags: []

vrfs:
  - name: MGMT-VRF
    rd: "65000:999"
    import_targets:
      - name: "65000:999"
    export_targets:
      - name: "65000:999"

bgp_routing_instances:
  - autonomous_system:
      asn: 65001
    router_id:
      address: "10.2.1.1/32"
    extra_attributes:
      timers:
        keepalive: 10
        hold: 30
      log_neighbor_changes: true
      default_ipv4_unicast: false
    peer_groups: []
    endpoints:
      # eBGP to PE (non-VRF, non-peer-group)
      - peer_group: null
        source_ip:
          address: "172.16.1.1/31"
        peering:
          endpoints:
            - source_ip:
                address: "172.16.1.0/31"
              routing_instance:
                device:
                  name: SPE1
                autonomous_system:
                  asn: 65000
            - source_ip:
                address: "172.16.1.1/31"
              routing_instance:
                device:
                  name: CE1
                autonomous_system:
                  asn: 65001
      # eBGP to DCA-Spine01 (non-VRF, non-peer-group)
      - peer_group: null
        source_ip:
          address: "10.1.1.0/31"
        peering:
          endpoints:
            - source_ip:
                address: "10.1.1.1/31"
              routing_instance:
                device:
                  name: DCA-Spine01
                autonomous_system:
                  asn: 65101
            - source_ip:
                address: "10.1.1.0/31"
              routing_instance:
                device:
                  name: CE1
                autonomous_system:
                  asn: 65001
      # eBGP to DCA-Spine02 (non-VRF, non-peer-group)
      - peer_group: null
        source_ip:
          address: "10.1.1.2/31"
        peering:
          endpoints:
            - source_ip:
                address: "10.1.1.3/31"
              routing_instance:
                device:
                  name: DCA-Spine02
                autonomous_system:
                  asn: 65101
            - source_ip:
                address: "10.1.1.2/31"
              routing_instance:
                device:
                  name: CE1
                autonomous_system:
                  asn: 65001
      # eBGP to border leaf DCA-Leaf03 (SERVERS handoff, non-VRF on CE side)
      - peer_group: null
        source_ip:
          address: "10.1.1.17/31"
        peering:
          endpoints:
            - source_ip:
                address: "10.1.1.16/31"
              routing_instance:
                device:
                  name: DCA-Leaf03
                autonomous_system:
                  asn: 65113
            - source_ip:
                address: "10.1.1.17/31"
              routing_instance:
                device:
                  name: CE1
                autonomous_system:
                  asn: 65001

igp_routing_instances: []
