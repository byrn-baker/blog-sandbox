---
_metadata:
  name: "DC Fabric Properties"
  description: "Schema for AVD-aligned Arista DC fabric config (spines + leaves)"
data_schema:
  type: object
  properties:
    platform:
      type: object
      properties:
        service_routing_protocols_model:
          type: string
          enum: ["multi-agent", "ribd"]
        vlan_internal_order:
          type: object
          properties:
            range_start:
              type: integer
            range_end:
              type: integer
        spanning_tree_mode:
          type: string
          enum: ["none", "mstp", "rstp", "rapid-pvst"]
        spanning_tree_priority:
          type: integer
    bgp:
      type: object
      properties:
        timers:
          type: object
          properties:
            keepalive:
              type: integer
            hold:
              type: integer
        maximum_paths:
          type: integer
        ecmp:
          type: integer
        log_neighbor_changes:
          type: boolean
        default_ipv4_unicast:
          type: boolean
        peer_groups:
          type: object
          properties:
            ipv4_underlay:
              type: object
              properties:
                name:
                  type: string
                send_community:
                  type: boolean
                maximum_routes:
                  type: integer
            evpn_overlay:
              type: object
              properties:
                name:
                  type: string
                next_hop_unchanged:
                  type: boolean
                update_source:
                  type: string
                ebgp_multihop:
                  type: integer
                bfd:
                  type: boolean
                send_community:
                  type: boolean
                maximum_routes:
                  type: integer
        redistribute:
          type: object
          properties:
            connected:
              type: object
              properties:
                route_map:
                  type: string
    evpn:
      type: object
      properties:
        multihop:
          type: integer
        update_source:
          type: string
    bfd:
      type: object
      properties:
        multihop:
          type: object
          properties:
            interval:
              type: integer
            min_rx:
              type: integer
            multiplier:
              type: integer
    vxlan:
      type: object
      properties:
        source_interface:
          type: string
        virtual_router_mac:
          type: string
    prefix_lists:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          entries:
            type: array
            items:
              type: object
              properties:
                sequence:
                  type: integer
                action:
                  type: string
                prefix:
                  type: string
                comparison:
                  type: string
    route_maps:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          entries:
            type: array
            items:
              type: object
              properties:
                sequence:
                  type: integer
                action:
                  type: string
                match:
                  type: string
    internet_egress:
      type: object
      properties:
        default_route:
          type: object
          properties:
            prefix:
              type: string
            egress_vrf:
              type: string
            prefix_list:
              type: string
            route_map:
              type: string
          additionalProperties: false
          required:
            - prefix
            - egress_vrf
            - prefix_list
            - route_map
        reverse_route:
          type: object
          properties:
            prefix_list:
              type: string
            route_map:
              type: string
          additionalProperties: false
          required:
            - prefix_list
            - route_map
      additionalProperties: false
      required:
        - default_route
        - reverse_route
  additionalProperties: true
