---
_metadata:
  name: "K3s Properties"
  description: "Schema for the stretched K3s cluster: per-node role and cluster-wide install settings consumed by Ansible via the Nautobot dynamic inventory"
data_schema:
  type: object
  properties:
    k3s:
      type: object
      properties:
        member:
          type: boolean
          description: "Whether this device is part of the K3s cluster. DNS-only hosts set this false."
        role:
          type: string
          enum: ["server", "agent"]
          description: "K3s node role. server nodes run the control plane (embedded etcd); agent nodes run workloads only."
        node_labels:
          type: string
          description: "Comma-separated Kubernetes node labels applied at join (e.g. topology.kubernetes.io/zone=dc-a)."
        cluster_init:
          type: boolean
          description: "True on exactly one server node — the node that runs --cluster-init to bootstrap embedded etcd."
      required:
        - member
    storage:
      type: object
      description: "Longhorn storage-node properties. Present on worker nodes that carry a secondary disk for replicated block storage."
      properties:
        enabled:
          type: boolean
          description: "Whether this node contributes a Longhorn disk. When true, the ansible longhorn_disk role formats and mounts the secondary disk at /var/lib/longhorn."
        disk_device:
          type: string
          description: "The secondary block device to use for Longhorn (e.g. /dev/sdb)."
        mount_path:
          type: string
          description: "Where the Longhorn disk is mounted (default /var/lib/longhorn)."
  additionalProperties: true
