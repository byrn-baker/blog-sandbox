name: Validate Golden Config Templates

on:
  push:
    paths:
      - '.github/workflows/validate-templates.yml'
      - '.j2lint.yml'
      - 'golden-config/templates/**'
      - 'golden-config/intended-configs/**'
      - 'config_contexts/**'
      - 'config_context_schemas/**'
      - 'tests/**'
      - 'Makefile'
  pull_request:
    paths:
      - '.github/workflows/validate-templates.yml'
      - '.j2lint.yml'
      - 'golden-config/templates/**'
      - 'golden-config/intended-configs/**'
      - 'config_contexts/**'
      - 'config_context_schemas/**'
      - 'tests/**'
      - 'Makefile'

jobs:
  lint-and-render:
    name: Lint + Render Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jinja2 pyyaml pytest j2lint

      - name: Run fast CI (j2lint + render tests)
        run: make ci

  batfish-validate:
    name: Batfish Config Validation
    runs-on: ubuntu-latest
    needs: lint-and-render
    services:
      batfish:
        image: batfish/batfish:latest
        ports:
          - 9997:9997
          - 9996:9996
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jinja2 pyyaml pytest pybatfish

      - name: Wait for Batfish to be ready
        shell: bash
        run: |
          set -euo pipefail
          batfish_ready=false
          for i in $(seq 1 30); do
            if python3 -c "
          from pybatfish.client.session import Session
          bf = Session(host='localhost')
          bf.set_network('probe')
          "; then
              batfish_ready=true
              break
            fi
            echo "Batfish is not ready yet (attempt ${i}/30)"
            sleep 2
          done

          if [[ "${batfish_ready}" != "true" ]]; then
            echo "Batfish failed to become ready after 30 attempts" >&2
            exit 1
          fi

      - name: Run Batfish validation
        run: make validate
