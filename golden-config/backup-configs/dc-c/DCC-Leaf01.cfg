! Command: show running-config
! device: DCC-Leaf01 (vEOS-lab, EOS-4.34.6M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Y/Uy2NuKP8M/hRwG$LoDQ5IuOvsLt3awUQkEQU9xVPxmDECFgCIMlsWkPQuD6wVf4nwpbg/9VS7.0BNV5lkmdXOzP6uuSvj2F.aU35/
!
management api http-commands
   no shutdown
   !
   vrf MGMT-VRF
      no shutdown
!
vlan internal order ascending range 1006 1199
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DCC-Leaf01
!
spanning-tree mode mstp
spanning-tree root super
spanning-tree vlan-id 1-4094 priority 4096
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT-VRF
!
interface Ethernet1
   description to DCC-Spine01 Ethernet2
   mtu 9214
   no switchport
   ip address 10.1.3.5/31
   ipv6 address fd10:1:3::5/127
!
interface Ethernet2
   description to DCC-Spine02 Ethernet2
   mtu 9214
   no switchport
   ip address 10.1.3.11/31
   ipv6 address fd10:1:3::11/127
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Loopback0
   description Router-ID
   ip address 10.2.3.4/32
   ipv6 address fd10:2:3::4/128
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   ip address 10.3.3.4/32
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   ip address 192.168.3.42/24
!
interface Vlan300
   description SERVER_K3S
   ip address virtual 192.168.100.1/24
   ipv6 address virtual fd10:a:300::1/64
!
interface Vlan301
   description STORAGE
   ip address virtual 192.168.101.1/24
   ipv6 address virtual fd10:a:301::1/64
!
interface Vxlan1
   description DCC-Leaf01_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vrf SERVERS vni 10000
!
no ip routing
no ip routing vrf MGMT-VRF
!
ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65311
   router-id 10.2.3.4
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.3.4 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.4 remote-as 65301
   neighbor 10.1.3.4 description DCC-Spine01
   neighbor 10.1.3.10 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.10 remote-as 65301
   neighbor 10.1.3.10 description DCC-Spine02
   neighbor 10.2.3.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.2 remote-as 65301
   neighbor 10.2.3.2 description DCC-Spine01
   neighbor 10.2.3.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.3 remote-as 65301
   neighbor 10.2.3.3 description DCC-Spine02
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
management ssh
   idle-timeout 15
   !
   vrf MGMT-VRF
      no shutdown
!
end