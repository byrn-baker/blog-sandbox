!
ipv6 unicast-routing
!
ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65301
   router-id 10.2.3.3
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.3.11 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.11 remote-as 65311
   neighbor 10.1.3.11 description DCC-Leaf01
   neighbor 10.1.3.13 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.13 remote-as 65312
   neighbor 10.1.3.13 description DCC-Leaf02
   neighbor 10.1.3.15 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.15 remote-as 65313
   neighbor 10.1.3.15 description DCC-Leaf03
   neighbor 10.2.3.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.4 remote-as 65311
   neighbor 10.2.3.4 description DCC-Leaf01
   neighbor 10.2.3.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.5 remote-as 65312
