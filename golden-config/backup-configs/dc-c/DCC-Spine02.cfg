   description to DCC-Leaf02 Ethernet2
   mtu 9214
   no switchport
   ip address 10.1.3.12/31
   ipv6 address fd10:1:3::12/127
!
interface Ethernet4
   description to DCC-Leaf03 Ethernet2
   mtu 9214
   no switchport
   ip address 10.1.3.14/31
