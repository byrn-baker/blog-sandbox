   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
management ssh
   idle-timeout 15
   !
   vrf MGMT-VRF
      no shutdown
