! Command: show running-config
! device: DCC-Spine02 (vEOS-lab, EOS-4.34.6M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$J5.Y5IxlB4epIUGo$wUAc.g7ItvVAAGKMakIAkam/2Dg9/znzfZ74BuzRHxUbiAMuTFTu.JAMU7jh6d2eoLOQJlE4gKd3wR8MbJOW51
!
management api http-commands
   no shutdown
   !
   vrf MGMT-VRF
      no shutdown
!
vlan internal order ascending range 1006 1199
!
no service interface inactive port-id allocation disabled
