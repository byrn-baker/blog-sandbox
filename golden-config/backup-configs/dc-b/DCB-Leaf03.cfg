system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 100
   name SERVER_K3S
!
vlan 201
   name STORAGE
!
vrf instance MGMT-VRF
!
vrf instance SERVERS
!
interface Ethernet1
   description to DCB-Spine01 Ethernet4
   mtu 9214
   no switchport
   ip address 10.1.2.9/31
   ipv6 address fd10:1:2::9/127
!
interface Ethernet2
   description to DCB-Spine02 Ethernet4
   mtu 9214
   no switchport
   ip address 10.1.2.15/31
   ipv6 address fd10:1:2::15/127
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Loopback0
   description Router-ID
   ip address 10.2.2.6/32
   ipv6 address fd10:2:2::6/128
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   ip address 10.3.2.6/32
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   ip address 192.168.3.39/24
!
interface Vlan100
   description SERVER_K3S
   vrf SERVERS
   ip address virtual 192.168.100.1/24
   ipv6 address virtual fd10:a:100::1/64
!
interface Vlan200
   description SERVER_K3S
   ip address virtual 192.168.200.1/24
   ipv6 address virtual fd10:a:200::1/64
!
interface Vlan201
   description STORAGE
   vrf SERVERS
   ip address virtual 192.168.201.1/24
   ipv6 address virtual fd10:a:201::1/64
!
interface Vxlan1
   description DCB-Leaf03_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vlan 201 vni 10201
   vxlan vrf SERVERS vni 10000
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT-VRF
ip routing vrf SERVERS
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
   seq 20 permit 10.3.0.0/16 eq 32
!
ipv6 unicast-routing
ipv6 unicast-routing vrf SERVERS
!
ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65213
   router-id 10.2.2.6
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.2.8 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.2.8 remote-as 65201
   neighbor 10.1.2.8 description DCB-Spine01
   neighbor 10.1.2.14 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.2.14 remote-as 65201
   neighbor 10.1.2.14 description DCB-Spine02
   neighbor 10.2.2.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.2.2 remote-as 65201
   neighbor 10.2.2.2 description DCB-Spine01
   neighbor 10.2.2.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.2.3 remote-as 65201
   neighbor 10.2.2.3 description DCB-Spine02
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.2.2.6:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 201
      rd 10.2.2.6:10201
      route-target both 10201:10201
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !
   vrf SERVERS
      rd 10.2.2.6:10000
      route-target import evpn 10000:10000
      route-target export evpn 10000:10000
      redistribute connected
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
management ssh
   idle-timeout 15
   !
   vrf MGMT-VRF
      no shutdown
!
