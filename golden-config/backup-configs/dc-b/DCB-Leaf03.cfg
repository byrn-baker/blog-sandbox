! Command: show running-config
! device: DCB-Leaf03 (vEOS-lab, EOS-4.34.6M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$BkJ/Is7C/7LzF59V$2vAtoBdPGiKrFnm42O3G0FFkfhM.KdQ0X6S72zpVWWOBnh.jjgpL3IzJywxBRr9hQXzd.3EZ/mMnkIsDv2bWB.
!
management api http-commands
   no shutdown
   !
   vrf MGMT-VRF
      no shutdown
!
vlan internal order ascending range 1006 1199
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DCB-Leaf03
!
spanning-tree mode mstp
spanning-tree root super
spanning-tree vlan-id 1-4094 priority 4096
spanning-tree mst 0 priority 4096
