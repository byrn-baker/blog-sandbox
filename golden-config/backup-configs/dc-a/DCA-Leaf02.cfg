! Command: show running-config
! device: DCA-Leaf02 (vEOS-lab, EOS-4.34.6M)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$aN6h7wlGOwigmYu4$Htj1vP5pY5DpVaFOxLvfb.XaTgtG5l90wg8Bok.RzBwaA5uLzddys6Lb4siHiTgjcOYfrd3Hm5UEzZhUV6Kfh.
!
management api http-commands
   no shutdown
   !
   vrf MGMT-VRF
      no shutdown
!
vlan internal order ascending range 1006 1199
!
no service interface inactive port-id allocation disabled
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
no logging console
!
hostname DCA-Leaf02
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 100
   name SERVER_K3S
!
vlan 101
   name STORAGE
!
vrf instance MGMT-VRF
!
vrf instance SERVERS
!
interface Port-Channel4
   description DCA-k3s-m1 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0010:0010:0010:0010:0010
      route-target import 00:10:00:10:00:10
!
interface Port-Channel5
   description DCA-k3s-w1 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0011:0011:0011:0011:0011
      route-target import 00:11:00:11:00:11
!
interface Port-Channel6
   description DCA-k3s-w2 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0012:0012:0012:0012:0012
      route-target import 00:12:00:12:00:12
!
interface Port-Channel7
   description DCA-DNS EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0071:0071:0071:0071:0071
      route-target import 00:71:00:71:00:71
!
interface Ethernet1
   description to DCA-Spine01 Ethernet3
   mtu 8950
   no switchport
   ip address 10.1.1.7/31
   ipv6 address fd10:1:1::7/127
!
interface Ethernet2
   description to DCA-Spine02 Ethernet3
   mtu 8950
   no switchport
   ip address 10.1.1.13/31
   ipv6 address fd10:1:1::13/127
!
interface Ethernet3
   shutdown
!
interface Ethernet4
   description DCA-k3s-m1 bond member (ESI multihome)
   channel-group 4 mode on
!
interface Ethernet5
   description DCA-k3s-w1 bond member (ESI multihome)
   channel-group 5 mode on
!
interface Ethernet6
   description DCA-k3s-w2 bond member (ESI multihome)
   channel-group 6 mode on
!
interface Ethernet7
   description dns-server-01 bond member (ESI multihome)
   channel-group 7 mode on
!
interface Ethernet8
   shutdown
!
interface Ethernet9
   shutdown
!
interface Ethernet10
   shutdown
!
interface Loopback0
   description Router-ID
   ip address 10.2.1.5/32
   ipv6 address fd10:2:1::5/128
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   ip address 10.3.1.5/32
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   ip address 192.168.3.33/24
!
interface Vlan100
   description SERVER_K3S
   vrf SERVERS
   ip attached-host route export
   ip address virtual 192.168.100.1/24
   ipv6 address virtual fd10:a:100::1/64
!
interface Vlan101
   description STORAGE
   vrf SERVERS
   ip address virtual 192.168.101.1/24
   ipv6 address virtual fd10:a:101::1/64
!
interface Vxlan1
   description DCA-Leaf02_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vrf SERVERS vni 10000
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT-VRF
ip routing vrf SERVERS
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
   seq 20 permit 10.3.0.0/16 eq 32
!
ipv6 unicast-routing
ipv6 unicast-routing vrf SERVERS
!
ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65112
   router-id 10.2.1.5
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS timers 30 90
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
   neighbor 10.1.1.6 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.6 remote-as 65101
   neighbor 10.1.1.6 description DCA-Spine01
   neighbor 10.1.1.12 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.12 remote-as 65101
   neighbor 10.1.1.12 description DCA-Spine02
   neighbor 10.2.1.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.2 remote-as 65101
   neighbor 10.2.1.2 description DCA-Spine01
   neighbor 10.2.1.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.3 remote-as 65101
   neighbor 10.2.1.3 description DCA-Spine02
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 100
      rd 10.2.1.5:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 101
      rd 10.2.1.5:10101
      route-target both 10101:10101
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !
   vrf SERVERS
      rd 10.2.1.5:10000
      route-target import evpn 10000:10000
      route-target export evpn 10000:10000
      redistribute connected
      redistribute attached-host
!
router multicast
   ipv4
      software-forwarding kernel
   !
   ipv6
      software-forwarding kernel
!
management ssh
   vrf MGMT-VRF
      no shutdown
!
end