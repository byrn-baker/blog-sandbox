hostname DCC-Spine01
!service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vlan internal order ascending range 1006 1199
!
vrf instance MGMT-VRF
!
interface Ethernet2
   description to DCC-Leaf01 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.4/31
   ipv6 address fd10:1:3::4/127
!
interface Ethernet3
   description to DCC-Leaf02 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.6/31
   ipv6 address fd10:1:3::6/127
!
interface Ethernet4
   description to DCC-Leaf03 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.8/31
   ipv6 address fd10:1:3::8/127
!
interface Ethernet10
   description to CE3 GigabitEthernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.1/31
   ipv6 address fd10:1:3::1/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.3.2/32
   ipv6 address fd10:2:3::2/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.40/24
!
ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!ip routing
ipv6 unicast-routing
!ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65301
   router-id 10.2.3.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
!
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
!
   neighbor 10.2.3.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.6 remote-as 65313
   neighbor 10.2.3.6 description DCC-Leaf03
   neighbor 10.2.3.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.5 remote-as 65312
   neighbor 10.2.3.5 description DCC-Leaf02
   neighbor 10.2.3.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.4 remote-as 65311
   neighbor 10.2.3.4 description DCC-Leaf01
   neighbor 10.1.3.5 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.5 remote-as 65311
   neighbor 10.1.3.5 description DCC-Leaf01
   neighbor 10.1.3.7 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.7 remote-as 65312
   neighbor 10.1.3.7 description DCC-Leaf02
   neighbor 10.1.3.9 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.9 remote-as 65313
   neighbor 10.1.3.9 description DCC-Leaf03
!
   redistribute connected route-map RM-CONN-2-BGP
!
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !
end