hostname DCC-Spine01
!vrf instance MGMT-VRF
!
interface Ethernet2
   description to DCC-Leaf01 Ethernet1
   no shutdown
   ip address 10.1.3.4/31
   ipv6 address fd10:1:3::4/127
!
interface Ethernet3
   description to DCC-Leaf02 Ethernet1
   no shutdown
   ip address 10.1.3.6/31
   ipv6 address fd10:1:3::6/127
!
interface Ethernet4
   description to DCC-Leaf03 Ethernet1
   no shutdown
   ip address 10.1.3.8/31
   ipv6 address fd10:1:3::8/127
!
interface Ethernet10
   description to CE3 GigabitEthernet3
   no shutdown
   ip address 10.1.3.1/31
   ipv6 address fd10:1:3::1/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.3.2/32
   ipv6 address fd10:2:3::2/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.60/24
!
ip routing
ipv6 unicast-routing
!router bgp 65301
   router-id 10.2.3.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end