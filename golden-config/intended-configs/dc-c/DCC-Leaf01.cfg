hostname DCC-Leaf01
!

service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vlan internal order ascending range 1006 1199
!
spanning-tree mst 0 priority 4096
!


vrf instance MGMT-VRF
!
vrf instance SERVERS
!


vlan 100
   name SERVER_K3S
!
vlan 301
   name STORAGE
!


ip virtual-router mac-address 00:1c:73:00:00:99
!
interface Port-Channel4
   description DCC-k3s-w4 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0030:0030:0030:0030:0030
      route-target import 00:30:00:30:00:30
!
interface Port-Channel5
   description DCC-k3s-w5 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0031:0031:0031:0031:0031
      route-target import 00:31:00:31:00:31
!
interface Port-Channel6
   description DCC-k3s-w6 EVPN ESI multihome
   switchport access vlan 100
   !
   evpn ethernet-segment
      identifier 0032:0032:0032:0032:0032
      route-target import 00:32:00:32:00:32
!
interface Ethernet1
   description to DCC-Spine01 Ethernet2
   mtu 8950
   no switchport
   ip address 10.1.3.5/31
   ipv6 address fd10:1:3::5/127
!
interface Ethernet2
   description to DCC-Spine02 Ethernet2
   mtu 8950
   no switchport
   ip address 10.1.3.11/31
   ipv6 address fd10:1:3::11/127
!
interface Ethernet3
   shutdown
!
interface Ethernet4
   description DCC-k3s-w4 bond member (ESI multihome)
   channel-group 4 mode on
!
interface Ethernet5
   description DCC-k3s-w5 bond member (ESI multihome)
   channel-group 5 mode on
!
interface Ethernet6
   description DCC-k3s-w6 bond member (ESI multihome)
   channel-group 6 mode on
!
interface Ethernet7
   shutdown
!
interface Ethernet8
   shutdown
!
interface Ethernet9
   shutdown
!
interface Ethernet10
   shutdown
!
interface Loopback0
   description Router-ID
   ip address 10.2.3.4/32
   ipv6 address fd10:2:3::4/128
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   ip address 10.3.3.4/32
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   ip address 192.168.3.42/24
!
interface Vlan100
   description SERVER_K3S
   vrf SERVERS
   ip address virtual 192.168.100.1/24
   ipv6 address virtual fd10:a:100::1/64
   ip attached-host route export
!
interface Vlan301
   description STORAGE
   vrf SERVERS
   ip address virtual 192.168.31.1/24
   ipv6 address virtual fd10:a:301::1/64
!


ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!

ip routing
ipv6 unicast-routing
!
ip routing vrf SERVERS
ipv6 unicast-routing vrf SERVERS
!


ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
   seq 20 permit 10.3.0.0/16 eq 32
!


route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!


router bfd
   multihop interval 300 min-rx 300 multiplier 3
!


router bgp 65311
   router-id 10.2.3.4
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS timers 30 90
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
!
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
!
   neighbor 10.1.3.10 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.10 remote-as 65301
   neighbor 10.1.3.10 description DCC-Spine02
   neighbor 10.1.3.4 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.3.4 remote-as 65301
   neighbor 10.1.3.4 description DCC-Spine01
   neighbor 10.2.3.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.2 remote-as 65301
   neighbor 10.2.3.2 description DCC-Spine01
   neighbor 10.2.3.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.3 remote-as 65301
   neighbor 10.2.3.3 description DCC-Spine02
!
   redistribute connected route-map RM-CONN-2-BGP
!
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !
   vlan 100
      rd 10.2.3.4:10100
      route-target both 10100:10100
      redistribute learned
   !
   vlan 301
      rd 10.2.3.4:10301
      route-target both 10301:10301
      redistribute learned
   !
   vrf SERVERS
      rd 10.2.3.4:10000
      route-target import evpn 10000:10000
      route-target export evpn 10000:10000
      redistribute connected
      redistribute attached-host
   !


interface Vxlan1
   description DCC-Leaf01_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 301 vni 10301
   vxlan vrf SERVERS vni 10000
!


end