hostname DCC-Leaf02
!service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vrf instance MGMT-VRF
!
interface Ethernet1
   description to DCC-Spine01 Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.7/31
   ipv6 address fd10:1:3::7/127
!
interface Ethernet2
   description to DCC-Spine02 Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.3.13/31
   ipv6 address fd10:1:3::13/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.3.5/32
   ipv6 address fd10:2:3::5/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.43/24
!

ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!ip routing
ipv6 unicast-routing
!router bgp 65312
   router-id 10.2.3.5
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end