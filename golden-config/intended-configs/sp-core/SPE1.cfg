hostname SPE1
!
vrf definition MGMT-VRF
 rd 65000:999
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!

vrf definition CUST-A
 rd 65000:100
 !
 address-family ipv4
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
 !
 address-family ipv6
  route-target export 65000:100
  route-target import 65000:100
 exit-address-family
!
interface GigabitEthernet1
 description Management - MGMT-VRF
 vrf forwarding MGMT-VRF
 no shutdown
 ip address 192.168.3.26 255.255.255.0
!
interface GigabitEthernet2
 description to SP2 GigabitEthernet4
 no shutdown
 ip address 10.0.0.9 255.255.255.254
 ipv6 address fd10::9/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet4
 description to SP4 GigabitEthernet4
 no shutdown
 ip address 10.0.0.11 255.255.255.254
 ipv6 address fd10::11/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet5
 description PE-CE to CE1 GigabitEthernet2 (VRF CUST-A)
 vrf forwarding CUST-A
 no shutdown
 ip address 172.16.1.0 255.255.255.254
 ipv6 address fd10:c:1::/127
!
interface Loopback0
 description Router-ID
 no shutdown
 ip address 10.1.0.7 255.255.255.255
 ipv6 address fd10:0:1::7/128
 ip router isis SP-ISIS
!
router isis SP-ISIS
 net 49.0001.0000.0007.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
 passive-interface Loopback0
 bfd all-interfaces
!
mpls ldp router-id Loopback0 force
mpls ldp igp sync
mpls ldp explicit-null
!
router bgp 65000
 bgp router-id 10.1.0.7
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 timers bgp 10 30
!
 neighbor RR-CLIENTS peer-group
 neighbor RR-CLIENTS remote-as 65000
 neighbor RR-CLIENTS update-source Loopback0
 neighbor RR-CLIENTS fall-over bfd
!
!
 address-family vpnv4
 exit-address-family
!
 address-family vpnv6
 exit-address-family
!
end