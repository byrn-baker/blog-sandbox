hostname BORDER1
!
vrf definition MGMT-VRF
 rd 65000:999
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
interface GigabitEthernet1
 description Management - MGMT-VRF
 vrf forwarding MGMT-VRF
 no shutdown
 ip address 192.168.3.19 255.255.255.0
!
interface GigabitEthernet2
 description to SP1 GigabitEthernet6
 no shutdown
 ip address 10.0.0.25 255.255.255.254
 ipv6 address fd10::25/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet3
 description to SP2 GigabitEthernet6
 no shutdown
 ip address 10.0.0.27 255.255.255.254
 ipv6 address fd10::27/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface Loopback0
 description Router-ID
 no shutdown
 ip address 10.1.0.10 255.255.255.255
 ipv6 address fd10:0:1::10/128
 ip router isis SP-ISIS
!
router isis SP-ISIS
 net 49.0001.0000.0010.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
 passive-interface Loopback0
 bfd all-interfaces
!
mpls ldp router-id Loopback0 force
mpls ldp igp sync
mpls ldp explicit-null
!
end