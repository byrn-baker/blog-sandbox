hostname SP1
!
vrf definition MGMT-VRF
 rd 65000:999
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
interface GigabitEthernet1
 description Management - MGMT-VRF
 vrf forwarding MGMT-VRF
 no shutdown
 ip address 192.168.3.22 255.255.255.0
!
interface GigabitEthernet2
 description to SP2 GigabitEthernet2
 no shutdown
 ip address 10.0.0.0 255.255.255.254
 ipv6 address fd10::/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet3
 description to SP3 GigabitEthernet3
 no shutdown
 ip address 10.0.0.6 255.255.255.254
 ipv6 address fd10::6/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet4
 description to SPE3 GigabitEthernet2
 no shutdown
 ip address 10.0.0.16 255.255.255.254
 ipv6 address fd10::16/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet5
 description to RR1 GigabitEthernet2
 no shutdown
 ip address 10.0.0.20 255.255.255.254
 ipv6 address fd10::20/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet6
 description to BORDER1 GigabitEthernet2
 no shutdown
 ip address 10.0.0.24 255.255.255.254
 ipv6 address fd10::24/127
 ip router isis SP-ISIS
 isis network point-to-point
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface Loopback0
 description Router-ID
 no shutdown
 ip address 10.1.0.3 255.255.255.255
 ipv6 address fd10:0:1::3/128
 ip router isis SP-ISIS
!
router isis SP-ISIS
 net 49.0001.0000.0003.0001.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes
 passive-interface Loopback0
 bfd all-interfaces
!
mpls ldp router-id Loopback0 force
mpls ldp igp sync
mpls ldp explicit-null
!
end