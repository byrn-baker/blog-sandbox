hostname DCA-Leaf01
!vrf instance MGMT-VRF
!
interface Ethernet1
   description to DCA-Spine01 Ethernet2
   no shutdown
   ip address 10.1.1.5/31
   ipv6 address fd10:1:1::5/127
!
interface Ethernet2
   description to DCA-Spine02 Ethernet2
   no shutdown
   ip address 10.1.1.11/31
   ipv6 address fd10:1:1::11/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.1.4/32
   ipv6 address fd10:2:1::4/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.42/24
!
ip routing
ipv6 unicast-routing
!router bgp 65111
   router-id 10.2.1.4
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end