hostname CE1
!
vrf definition MGMT-VRF
 rd 65000:999
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
interface GigabitEthernet1
 description Management - MGMT-VRF
 vrf forwarding MGMT-VRF
 no shutdown
 ip address 192.168.3.29 255.255.255.0
!
interface GigabitEthernet2
 description PE-CE to SPE1 GigabitEthernet5
 no shutdown
 ip address 172.16.1.1 255.255.255.254
 ipv6 address fd10:c:1::1/127
!
interface GigabitEthernet3
 description to DCA-Spine01 Ethernet10
 no shutdown
 ip address 10.1.1.0 255.255.255.254
 ipv6 address fd10:1:1::/127
!
interface GigabitEthernet4
 description to DCA-Spine02 Ethernet10
 no shutdown
 ip address 10.1.1.2 255.255.255.254
 ipv6 address fd10:1:1::2/127
!
interface Loopback0
 description Router-ID
 no shutdown
 ip address 10.2.1.1 255.255.255.255
 ipv6 address fd10:2:1::1/128
!
router bgp 65001
 bgp router-id 10.2.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 timers bgp 10 30
!
!
!
end