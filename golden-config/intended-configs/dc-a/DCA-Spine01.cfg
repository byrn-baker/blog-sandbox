hostname DCA-Spine01
!

service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vlan internal order ascending range 1006 1199
!


vrf instance MGMT-VRF
!




interface Ethernet2
   description to DCA-Leaf01 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.4/31
   ipv6 address fd10:1:1::4/127
!
interface Ethernet3
   description to DCA-Leaf02 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.6/31
   ipv6 address fd10:1:1::6/127
!
interface Ethernet4
   description to DCA-Leaf03 Ethernet1
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.8/31
   ipv6 address fd10:1:1::8/127
!
interface Ethernet10
   description to CE1 GigabitEthernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.1/31
   ipv6 address fd10:1:1::1/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.1.2/32
   ipv6 address fd10:2:1::2/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.30/24
!


ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!

ip routing
ipv6 unicast-routing
!


ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
!


route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!


router bfd
   multihop interval 300 min-rx 300 multiplier 3
!


router bgp 65101
   router-id 10.2.1.2
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
!
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
!
   neighbor 10.2.3.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.3 remote-as 65301
   neighbor 10.2.3.3 description DCC-Spine02
   neighbor 10.2.3.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.3.2 remote-as 65301
   neighbor 10.2.3.2 description DCC-Spine01
   neighbor 10.2.2.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.2.3 remote-as 65201
   neighbor 10.2.2.3 description DCB-Spine02
   neighbor 10.2.2.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.2.2 remote-as 65201
   neighbor 10.2.2.2 description DCB-Spine01
   neighbor 10.2.1.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.6 remote-as 65113
   neighbor 10.2.1.6 description DCA-Leaf03
   neighbor 10.2.1.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.5 remote-as 65112
   neighbor 10.2.1.5 description DCA-Leaf02
   neighbor 10.2.1.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.4 remote-as 65111
   neighbor 10.2.1.4 description DCA-Leaf01
   neighbor 10.1.1.9 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.9 remote-as 65113
   neighbor 10.1.1.9 description DCA-Leaf03
   neighbor 10.1.1.7 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.7 remote-as 65112
   neighbor 10.1.1.7 description DCA-Leaf02
   neighbor 10.1.1.5 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.5 remote-as 65111
   neighbor 10.1.1.5 description DCA-Leaf01
   neighbor 10.1.1.0 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.0 remote-as 65001
   neighbor 10.1.1.0 description CE1
!
   redistribute connected route-map RM-CONN-2-BGP
!
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !




end