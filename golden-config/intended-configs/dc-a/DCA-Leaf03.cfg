hostname DCA-Leaf03
!service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vrf instance MGMT-VRF
!
interface Ethernet1
   description to DCA-Spine01 Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.9/31
   ipv6 address fd10:1:1::9/127
!
interface Ethernet2
   description to DCA-Spine02 Ethernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.15/31
   ipv6 address fd10:1:1::15/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.1.6/32
   ipv6 address fd10:2:1::6/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.34/24
!

ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!ip routing
ipv6 unicast-routing
!router bgp 65113
   router-id 10.2.1.6
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end