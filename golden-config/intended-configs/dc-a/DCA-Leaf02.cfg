hostname DCA-Leaf02
!service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vlan internal order ascending range 1006 1199
!
spanning-tree root super
spanning-tree vlan-id 1-4094 priority 4096
!
vrf instance MGMT-VRF
!
vrf instance SERVERS
!
vlan 100
   name SERVER_K3S
!
vlan 101
   name STORAGE
!
interface Ethernet1
   description to DCA-Spine01 Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.7/31
   ipv6 address fd10:1:1::7/127
!
interface Ethernet2
   description to DCA-Spine02 Ethernet3
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.1.13/31
   ipv6 address fd10:1:1::13/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.1.5/32
   ipv6 address fd10:2:1::5/128
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   no shutdown
   ip address 10.3.1.5/32
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.33/24
!
interface Vlan100
   description SERVER_K3S
   vrf SERVERS
   no shutdown
   ip address virtual 192.168.100.1/24
   ipv6 address virtual fd10:a:100::1/64
!
interface Vlan101
   description STORAGE
   vrf SERVERS
   no shutdown
   ip address virtual 192.168.101.1/24
   ipv6 address virtual fd10:a:101::1/64
!

ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!ip routing
ipv6 unicast-routing
!ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.2.0.0/16 eq 32
   seq 20 permit 10.3.0.0/16 eq 32
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65112
   router-id 10.2.1.5
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
!
   neighbor IPV4-UNDERLAY-PEERS peer group
   neighbor IPV4-UNDERLAY-PEERS send-community
   neighbor IPV4-UNDERLAY-PEERS maximum-routes 12000
!
   neighbor 10.1.1.6 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.6 remote-as 65101
   neighbor 10.1.1.6 description DCA-Spine01
   neighbor 10.1.1.12 peer group IPV4-UNDERLAY-PEERS
   neighbor 10.1.1.12 remote-as 65101
   neighbor 10.1.1.12 description DCA-Spine02
   neighbor 10.2.1.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.2 remote-as 65101
   neighbor 10.2.1.2 description DCA-Spine01
   neighbor 10.2.1.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.2.1.3 remote-as 65101
   neighbor 10.2.1.3 description DCA-Spine02
!
   redistribute connected route-map RM-CONN-2-BGP
!
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPV4-UNDERLAY-PEERS activate
      redistribute connected
   !
interface Vxlan1
   description DCA-Leaf02_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 100 vni 10100
   vxlan vlan 101 vni 10101
   vxlan vrf SERVERS vni 10000
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
end