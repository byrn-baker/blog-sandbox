hostname DCA-Leaf02
!vrf instance MGMT-VRF
!
interface Ethernet1
   description to DCA-Spine01 Ethernet3
   no shutdown
   ip address 10.1.1.7/31
   ipv6 address fd10:1:1::7/127
!
interface Ethernet2
   description to DCA-Spine02 Ethernet3
   no shutdown
   ip address 10.1.1.13/31
   ipv6 address fd10:1:1::13/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.1.5/32
   ipv6 address fd10:2:1::5/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.43/24
!
ip routing
ipv6 unicast-routing
!router bgp 65112
   router-id 10.2.1.5
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end