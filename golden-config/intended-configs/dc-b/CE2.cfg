hostname CE2
!
vrf definition MGMT-VRF
 rd 65000:999
 !
 address-family ipv4
 exit-address-family
 !
 address-family ipv6
 exit-address-family
!
interface GigabitEthernet1
 description Management - MGMT-VRF
 vrf forwarding MGMT-VRF
 no shutdown
 ip address 192.168.3.30 255.255.255.0
!
interface GigabitEthernet2
 description PE-CE to SPE2 GigabitEthernet5
 no shutdown
 ip address 172.16.2.1 255.255.255.254
 ipv6 address fd10:c:2::1/127
!
interface GigabitEthernet3
 description to DCB-Spine01 Ethernet10
 no shutdown
 ip address 10.1.2.0 255.255.255.254
 ipv6 address fd10:1:2::/127
!
interface GigabitEthernet4
 description to DCB-Spine02 Ethernet10
 no shutdown
 ip address 10.1.2.2 255.255.255.254
 ipv6 address fd10:1:2::2/127
!
interface Loopback0
 description Router-ID
 no shutdown
 ip address 10.2.2.1 255.255.255.255
 ipv6 address fd10:2:2::1/128
!
router bgp 65002
 bgp router-id 10.2.2.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 timers bgp 10 30
!
!
!
end