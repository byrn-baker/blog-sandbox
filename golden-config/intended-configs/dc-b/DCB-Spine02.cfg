hostname DCB-Spine02
!service routing protocols model multi-agent
!
spanning-tree mode mstp
!
vrf instance MGMT-VRF
!
interface Ethernet2
   description to DCB-Leaf01 Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.10/31
   ipv6 address fd10:1:2::10/127
!
interface Ethernet3
   description to DCB-Leaf02 Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.12/31
   ipv6 address fd10:1:2::12/127
!
interface Ethernet4
   description to DCB-Leaf03 Ethernet2
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.14/31
   ipv6 address fd10:1:2::14/127
!
interface Ethernet10
   description to CE2 GigabitEthernet4
   no shutdown
   mtu 9214
   no switchport
   ip address 10.1.2.3/31
   ipv6 address fd10:1:2::3/127
!
interface Loopback0
   description Router-ID
   no shutdown
   ip address 10.2.2.3/32
   ipv6 address fd10:2:2::3/128
!
interface Management1
   description Management - MGMT-VRF
   vrf MGMT-VRF
   no shutdown
   ip address 192.168.3.36/24
!

ip route vrf MGMT-VRF 0.0.0.0/0 192.168.3.1
!ip routing
ipv6 unicast-routing
!router bgp 65201
   router-id 10.2.2.3
   no bgp default ipv4-unicast
   maximum-paths 4 ecmp 4
   timers bgp 3 9
!
!
   address-family ipv4
      redistribute connected
   !
   address-family evpn
   !
end